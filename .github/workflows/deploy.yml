name: Build and Deploy Admin Web to Azure

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app for production
        run: npm run build
        env:
          VITE_API_BASE_URL: https://car-bidding-api-w6y8m.azurewebsites.net/api

      - name: Deploy dist to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'car-bidding-admin-w6y8m'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './dist'
